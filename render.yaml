# Render Blueprint: DocMind backend (Docker) + PostgreSQL with pgvector.
# Dashboard -> New -> Blueprint -> select this repository.
# The frontend is deployed separately on Vercel (see frontend/vercel.json and README "Deploying").
services:
  - type: web
    name: docmind-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Spring Boot + Apache Tika need more than the free plan's 512 MB to parse larger documents.
    # "free" works for a demo, but it sleeps when idle and may run out of memory on big PDFs.
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: docmind-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: docmind-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: docmind-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: docmind-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: docmind-db
          property: password
      # random 256-bit value generated by Render on first deploy
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_COOKIE_SECURE
        value: "true"
      - key: REFRESH_COOKIE_SAME_SITE
        value: Strict
      # set in the dashboard: your Vercel URL, e.g. https://docmind.vercel.app (comma-separate several)
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_CHAT_MODEL
        value: gpt-4o-mini
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small

databases:
  - name: docmind-db
    databaseName: docmind
    user: docmind
    postgresMajorVersion: "16"
    plan: basic-256mb
    # only the backend (inside Render's private network) needs access
    ipAllowList: []
