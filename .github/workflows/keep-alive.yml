# Keeps the Render free-plan backend awake by calling its health endpoint on a schedule.
# Complements the in-app KeepAliveService: this one can also wake an instance that already slept
# (for example after a deploy or restart).
#
# Setup: GitHub repo -> Settings -> Secrets and variables -> Actions -> Variables ->
#        New repository variable  RENDER_HEALTH_URL = https://<your-service>.onrender.com/actuator/health
name: Keep Render backend awake

on:
  schedule:
    # every 10 minutes (GitHub may start scheduled runs a few minutes late)
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        env:
          URL: ${{ vars.RENDER_HEALTH_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "RENDER_HEALTH_URL is not set; nothing to ping."
            exit 0
          fi
          # a cold start can take about a minute, so retry with a generous timeout
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 90 "$URL"; then
              echo
              echo "Backend is up (attempt $attempt)."
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 20s"
            sleep 20
          done
          echo "Backend did not respond after 3 attempts."
          exit 1
