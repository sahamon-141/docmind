# Base configuration. Safe for production: every secret must come from the environment.
# Local development defaults live in application-dev.yml (activate with SPRING_PROFILES_ACTIVE=dev).
spring:
  application:
    name: docmind-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:docmind}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # Lets HNSW keep scanning when a metadata filter (per-user isolation) discards candidates.
      # Requires pgvector >= 0.8; older versions treat it as an inert placeholder setting.
      connection-init-sql: SET hnsw.iterative_scan = relaxed_order

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Databases created by the old Hibernate ddl-auto=update setup have tables but no Flyway history.
    # Baselining at version 0 records them as "pre-Flyway" so V1 (written idempotently) still runs
    # and upgrades them. Empty databases are unaffected.
    baseline-on-migrate: true
    baseline-version: 0

  ai:
    openai:
      # For an OpenAI-compatible provider also set SPRING_AI_OPENAI_BASE_URL.
      api-key: ${OPENAI_API_KEY}
      chat:
        model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
        temperature: 0.2
      embedding:
        # Must produce 1536-dimensional vectors to match the vector_store schema (V1 migration).
        model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        table-name: vector_store
        schema-name: public
        # The table is owned by Flyway (V1__baseline.sql), not by Spring AI.
        initialize-schema: false

  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:25MB}
      max-request-size: ${MAX_REQUEST_SIZE:100MB}

server:
  port: ${SERVER_PORT:8081}
  error:
    include-stacktrace: never
    include-message: never

app:
  rag:
    chunk-size: 700
    min-chunk-size-chars: 350
    min-chunk-length-to-embed: 5
    max-num-chunks: 10000
    top-k: 5
    max-top-k: 20
    similarity-threshold: 0.0
    snippet-length: 600
  documents:
    max-files-per-request: 10
    allowed-extensions: pdf,txt,md,markdown,csv,docx,doc,pptx,odt,rtf,html,htm
  cors:
    # Comma-separated list of exact origins. Never "*" because credentials (refresh cookie) are allowed.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    allowed-methods: GET,POST,PATCH,PUT,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,X-DocMind-CSRF,Accept
  security:
    jwt:
      # Base64 or raw string of at least 32 bytes. Required outside the dev profile.
      secret: ${JWT_SECRET:}
      allow-ephemeral-secret: false
      issuer: docmind
      access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh:
      ttl: ${REFRESH_TOKEN_TTL:7d}
      cookie-name: docmind_refresh
      cookie-path: /api/v1/auth
      cookie-secure: ${REFRESH_COOKIE_SECURE:true}
      cookie-same-site: ${REFRESH_COOKIE_SAME_SITE:Strict}
      reuse-grace-period: 10s
      cleanup-cron: "0 15 3 * * *"
      cleanup-retention: 7d

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
