# Local development profile. Convenient defaults that are NOT acceptable in production.
spring:
  datasource:
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  ai:
    openai:
      # A placeholder lets the app start without a key; AI calls fail until OPENAI_API_KEY is set.
      api-key: ${OPENAI_API_KEY:key}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  security:
    jwt:
      # When JWT_SECRET is unset, a random per-process key is generated (dev only).
      # Access tokens then stop validating after a restart; refresh tokens keep working.
      allow-ephemeral-secret: true
    refresh:
      # Browsers treat http://localhost as a secure context, but plain-HTTP LAN hosts are not.
      cookie-secure: ${REFRESH_COOKIE_SECURE:false}

logging:
  level:
    com.example.docmind: DEBUG
