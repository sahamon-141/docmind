# Serves the built SPA and proxies the API on the same origin, so the refresh-token cookie stays
# first-party (SameSite=Strict) and no CORS configuration is needed.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 30m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-Sent Events: stream tokens as they arrive
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    location = /actuator/health {
        proxy_pass http://backend:8081;
    }

    # No add_header inside locations: it would drop the server-level security headers above.
    location /assets/ {
        expires 1y; # hashed file names
        try_files $uri =404;
    }

    location / {
        expires -1; # always revalidate index.html
        try_files $uri /index.html;
    }
}
