# Local development:   docker compose up -d                 (PostgreSQL + pgvector only)
# Full stack:          docker compose --profile app up -d --build
#                      (requires JWT_SECRET and OPENAI_API_KEY in .env; UI on http://localhost:8080)
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: doc-mind-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5434}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-docmind}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      # volume name kept from the original setup so existing local data survives
      - ytpgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-docmind}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    profiles: [ "app" ]
    build: .
    container_name: doc-mind-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-docmind}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 bytes)}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      # served over plain http://localhost by default; set to true behind HTTPS
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
    ports:
      - "${SERVER_PORT:-8081}:8081"
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8081 && printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    profiles: [ "app" ]
    build: ./frontend
    container_name: doc-mind-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  ytpgdata:
